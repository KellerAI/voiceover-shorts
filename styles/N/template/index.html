<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080, height=1920"/>
<title>Style N: gallery placard, __N_TITLE__</title>
<!--
  Style N template, from the canonical look (read only). Instantiate with styles/N/build.py,
  which writes the gallery plan into window.__N and the composition length into every
  data-duration. Do not edit an instantiated copy by hand.

  The look is unchanged in kind: one cream gallery wall of 1080 px bays, a spotlight pool per bay,
  vignette and film grain stepped at 12 fps; every frame 820x980 at left 130 / top 470 (one eye
  line), every placard 820 wide at top 1500; a Baskerville headline per bay with word pops on the
  voice and the key word on a navy block; 0.6 s power4.inOut whips with a horizontal motion blur
  and +-14 px creeps on the holds; pieces from the canonical (circles that overlap, the hockey
  chart with the yellow "Untitled (Marketing Claim)" sticky in Lilita One and Comic Shanns, the
  terminal, the A = B collapse, and the final room with the K tile and the wordmark).

  Script-agnostic: rooms, their timing and copy come from build.py's plan (clauses of the words
  file); the end card is the shared kit/endcard.js, cut in 0.1 s after the last word, held 2 s.

  Preflight fixes vs the canonical look: every text run renders >= 44 px at 1080 wide (placard
  caption 36 -> 46 px, title 48 -> 56 px, HUD labels 34 -> 44 px, terminal 33/31 -> 44 px, chart
  label 40 -> 46 px, sticky medium 38 -> 44 px; the "10x!!" and "A = B" pops start at scale >= 0.6
  instead of 0), the frame and placard fill the lower third on every bay, the wall never fades
  to black (the kit end card cuts in with a slow push so its hold never freezes), and the audio
  is one bus from kit/sfx_bus.py. Fonts (D4): no D4 font was used by the canonical; Menlo (the
  terminal) is swapped for the bundled OFL Comic Shanns (monospace) and the gag keeps the bundled
  Lilita One and Comic Shanns. Baskerville and Helvetica Neue stay as local() macOS faces (not on
  the D4 list; styles.json lists them under fonts.system_other) with serif/sans fallbacks.
-->
<script src="kit/gsap.min.js"></script>
<script src="kit/endcard.js"></script>
<style>
@font-face { font-family: "KS Lilita"; font-weight: 400 900; src: url("assets/fonts/LilitaOne.woff2") format("woff2"); }
@font-face { font-family: "KS Shanns"; font-weight: 300 900; src: url("assets/fonts/ComicShanns.woff2") format("woff2"); }
@font-face { font-family: "KSerif"; src: local("Baskerville"), local("Baskerville-Regular"); font-weight: 400; }
@font-face { font-family: "KSerif"; src: local("Baskerville-Italic"), local("Baskerville Italic"); font-weight: 400; font-style: italic; }
@font-face { font-family: "KSerif"; src: local("Baskerville-SemiBold"), local("Baskerville SemiBold"), local("Baskerville-Bold"); font-weight: 600; }
@font-face { font-family: "KSans"; src: local("HelveticaNeue-Medium"), local("Helvetica Neue Medium"); font-weight: 500; }
:root { --cream: #FBF7F0; --navy: #0F1B2D; --navy2: #10243E; --graphite: #202020; --slate: #8B9090; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); color: var(--graphite); font-family: "KSerif", Georgia, serif; }
#view { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
#wall { position: absolute; left: 0; top: 0; height: 1920px; will-change: transform;
  background: linear-gradient(180deg, #FBF7F0 0%, #F7F1E6 100%); }
.bay { position: absolute; top: 0; width: 1080px; height: 1920px; }
.light { position: absolute; left: 0; top: 300px; width: 1080px; height: 1300px; pointer-events: none;
  background: radial-gradient(ellipse 48% 46% at 50% 48%, rgba(255,251,240,1) 0%, rgba(255,248,232,0.4) 58%, rgba(255,248,232,0) 78%); }
/* LOCKED eye line: every frame 820x980 at left 130, top 470; every placard 820 wide at left 130, top 1500 */
.frame { position: absolute; left: 130px; top: 470px; width: 820px; height: 980px; background: #fff; border: 18px solid #202020;
  box-shadow: 0 2px 0 rgba(0,0,0,0.04), 0 36px 60px -18px rgba(32,32,32,0.32), 0 12px 18px -8px rgba(32,32,32,0.2); }
.frame .mat { position: absolute; inset: 0; border: 44px solid #FDFBF6; }
.frame .art { position: absolute; inset: 44px; overflow: hidden; }
.placard { position: absolute; left: 130px; top: 1500px; width: 820px; min-height: 250px; padding: 28px 36px 30px; background: #FFFDF8;
  box-shadow: 0 10px 20px -10px rgba(32,32,32,0.35); color: #0d0d0d; }
.placard .t { font-size: 56px; line-height: 1.1; font-weight: 600; }
.placard .cap { font-size: 46px; line-height: 1.24; margin-top: 14px; padding-top: 14px; border-top: 2px solid #cfc7b6; color: #111; }
.head { position: absolute; left: 0; top: 130px; width: 1080px; height: 320px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  font-size: 104px; line-height: 1.0; font-weight: 600; color: #0F1B2D; text-align: center; letter-spacing: -0.012em; }
.head .ln { white-space: nowrap; padding: 4px 0; }
.head .w { display: inline-block; }
.head .hl { background: #0F1B2D; color: #FBF7F0; padding: 0 .13em 4px; margin: 0 .04em; }
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
#hud .lab { position: absolute; left: 64px; top: 52px; font-family: "KSans", "Helvetica Neue", Arial, sans-serif; font-weight: 500; font-size: 44px; letter-spacing: 0.12em; color: #141414; }
#hud .room { position: absolute; right: 64px; top: 52px; font-family: "KSans", "Helvetica Neue", Arial, sans-serif; font-weight: 500; font-size: 44px; letter-spacing: 0.12em; color: #141414; opacity: 0; }
#vig { position: absolute; inset: 0; z-index: 15; pointer-events: none;
  background: radial-gradient(ellipse 80% 62% at 50% 46%, rgba(0,0,0,0) 58%, rgba(60,46,30,0.18) 100%); }
#grain { position: absolute; left: -200px; top: -200px; width: 1480px; height: 2320px; z-index: 16; pointer-events: none; opacity: 0.24; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='3' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0 0.45  0.9 0 0 0 -0.2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
.term { font-family: "KS Shanns", monospace; font-size: 44px; line-height: 1.42; color: #E9EEF5; white-space: pre-wrap; word-break: break-all; }
.slop { font-family: "KS Shanns", monospace; }
.loud { font-family: "KS Lilita", sans-serif; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="hb" x="-5%" y="0" width="110%" height="100%"><feGaussianBlur id="hbf" stdDeviation="0 0"/></filter></svg>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-fps="30" data-duration="__N_DURATION__">
  <div id="view"><div id="wall"></div></div>
  <div id="vig"></div>
  <div id="grain"></div>
  <div id="hud"><div class="lab" id="hudlab"></div></div>
  <audio id="vo" src="assets/voice_norm.wav" data-start="0" data-duration="__N_VO_DURATION__" data-volume="1"></audio>
  <audio id="sfx" src="assets/sfx_bus.wav" data-start="0" data-duration="__N_DURATION__" data-volume="1"></audio>
</div>
<script>
window.__N = /*__N_DATA__*/null;
(function () {
  window.__timelines = window.__timelines || {};
  var D = window.__N, FPS = 30;
  var root = document.getElementById("root");
  var END = parseFloat(root.getAttribute("data-duration"));
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  var KTILE = '<svg id="ktile" viewBox="0 0 640 640" width="380" height="380" style="box-shadow:0 40px 60px -22px rgba(32,32,32,0.5)"><rect width="640" height="640" fill="#202020"/><path fill="#fff" d="M154 128h77v166l-77 91z"/><path fill="#fff" d="M154 414h77v98h-77z"/><path fill="#fff" d="M345 321 511 512h-95L296 376z"/><path fill="#8B9090" d="M400 128h89L154 512v-98z"/></svg>';
  function ROCKET(k) { return '<svg id="rocket' + k + '" width="48" height="48" viewBox="0 0 48 48" style="flex:none"><path d="M24 3c7 6 10 15 9 26l-5 5H20l-5-5C14 18 17 9 24 3z" fill="#e8e8f0" stroke="#202020" stroke-width="2.5"/><circle cx="24" cy="18" r="4.5" fill="#1d3cff" stroke="#202020" stroke-width="2"/><path d="M15 27l-7 10 9-2zM33 27l7 10-9-2z" fill="#FF2EA6" stroke="#202020" stroke-width="2.5"/><path d="M20 35h8l-4 11z" fill="#ff9a1a" stroke="#202020" stroke-width="2"/></svg>'; }

  function headHTML(k, words, id, hidden) {
    var lines = [[], []];
    words.forEach(function (w, i) {
      lines[w.line].push('<span class="w' + (w.hl ? ' hl' : '') + '" id="' + id + 'w' + i + '">' + esc(w.text) + '</span>');
    });
    return '<div class="head" id="' + id + '"' + (hidden ? ' style="opacity:0"' : '') + '>' +
      lines.filter(function (l) { return l.length; }).map(function (l) { return '<div class="ln">' + l.join(" ") + '</div>'; }).join("") + '</div>';
  }

  function artHTML(k, r) {
    var m = r.motif;
    if (m === "circles") {
      return '<div class="art" style="background:#0F1B2D"><svg viewBox="0 0 696 856" width="696" height="856">' +
        '<g id="c' + k + 'g" style="transform-origin:348px 400px">' +
        '<circle cx="220" cy="400" r="170" fill="rgba(251,247,240,0.06)" stroke="#FBF7F0" stroke-width="5"/>' +
        '<circle id="c' + k + 'b" cx="476" cy="400" r="170" fill="rgba(251,247,240,0.06)" stroke="#8B9090" stroke-width="5"/>' +
        '<text x="170" y="425" fill="#FBF7F0" font-family="KSerif, Georgia, serif" font-size="72">A</text>' +
        '<text id="c' + k + 'bt" x="500" y="425" fill="#8B9090" font-family="KSerif, Georgia, serif" font-size="72">B</text>' +
        '</g></svg></div>';
    }
    if (m === "chart") {
      var g = D.gag;
      return '<div class="art" style="background:#FFFDF8"><svg viewBox="0 0 696 856" width="696" height="856">' +
        '<g stroke="#e4ddd0" stroke-width="2"><line x1="70" y1="200" x2="650" y2="200"/><line x1="70" y1="360" x2="650" y2="360"/><line x1="70" y1="520" x2="650" y2="520"/></g>' +
        '<line x1="70" y1="700" x2="650" y2="700" stroke="#202020" stroke-width="4"/><line x1="70" y1="90" x2="70" y2="700" stroke="#202020" stroke-width="4"/>' +
        '<path id="hock' + k + '" d="M80 680 L230 672 L360 655 L470 610 L540 520 L590 360 L635 110" fill="none" stroke="#FF2EA6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<text x="80" y="780" font-family="KS Shanns, monospace" font-size="46" fill="#202020">' + esc(g.label) + '</text>' +
        '<text id="ten' + k + '" x="190" y="260" font-family="KS Lilita, sans-serif" font-size="120" fill="#FF2EA6" transform="rotate(-8 190 260)">' + esc(g.number) + '</text>' +
        '</svg></div>';
    }
    if (m === "terminal") {
      var T = D.terminal;
      return '<div class="art" style="background:#10243E; padding:40px 34px">' +
        T.prior.map(function (s) { return '<div class="term" style="color:#8B9090">' + esc(s) + '</div>'; }).join("") +
        '<div class="term" style="margin-top:30px"><span style="color:#8B9090">$</span> <span id="cmd' + k + '"></span><span id="caret' + k + '">▍</span></div>' +
        '<div class="term" id="o' + k + 'a" style="color:#8B9090; opacity:0; margin-top:22px">' + esc(T.out[0] || "") + '</div>' +
        '<div class="term" id="o' + k + 'b" style="opacity:0; margin-top:12px; font-size:52px; font-weight:700; color:#7BE0A4">' + esc(T.out[1] || "") + '</div>' +
        '<div class="term" id="o' + k + 'c" style="opacity:0; margin-top:12px; color:#B9C2CC">' + esc(T.out[2] || "") + '</div>' +
        '</div>';
    }
    if (m === "merge") {
      return '<div class="art" style="background:#FBF7F0"><svg viewBox="0 0 696 856" width="696" height="856">' +
        '<circle id="m' + k + 'a" cx="348" cy="380" r="150" fill="none" stroke="#0F1B2D" stroke-width="6"/>' +
        '<circle id="m' + k + 'b" cx="348" cy="380" r="150" fill="none" stroke="#0F1B2D" stroke-width="6" stroke-dasharray="14 12"/>' +
        '<text id="m' + k + 'la" x="215" y="402" text-anchor="middle" font-family="KSerif, Georgia, serif" font-size="64" fill="#0F1B2D">A</text>' +
        '<text id="m' + k + 'lb" x="481" y="402" text-anchor="middle" font-family="KSerif, Georgia, serif" font-size="64" fill="#0F1B2D">B</text>' +
        '<text id="eq' + k + '" x="348" y="740" text-anchor="middle" font-family="KSerif, Georgia, serif" font-style="italic" font-size="112" fill="#202020">' + esc(D.merge_eq) + '</text>' +
        '</svg></div>';
    }
    // brand: the final framed piece
    return '<div class="art" style="background:#FBF7F0; display:flex; flex-direction:column; align-items:center; justify-content:center">' +
      KTILE + '<div id="wm" style="margin-top:64px; font-family:KSerif, Georgia, serif; font-size:116px; letter-spacing:0.01em; color:#202020; white-space:nowrap">' + esc(D.name) + '</div></div>';
  }

  function placardHTML(k, r) {
    if (r.motif === "chart") {
      var g = D.gag;
      return '<div class="placard" id="p' + k + '" style="background:#FFF6A8; transform:rotate(-2deg)">' +
        '<div class="t loud" style="font-weight:400; font-size:54px; line-height:1.04; color:#1d3cff">' + esc(g.title) + '</div>' +
        '<div class="slop" style="font-size:44px; margin-top:12px; color:#111">' + esc(g.medium) + '</div>' +
        '<div class="cap slop" style="font-size:44px; border-top:3px dashed #FF2EA6; display:flex; align-items:center; gap:14px"><span>' + esc(r.caption) + '</span>' + ROCKET(k) + '</div></div>';
    }
    return '<div class="placard" id="p' + k + '"><div class="t">' + esc(r.title) + '</div><div class="cap">' + esc(r.caption) + '</div></div>';
  }

  // ---------------------------------------------------------------- DOM from the plan
  var wall = document.getElementById("wall");
  wall.style.width = (1080 * D.rooms.length) + "px";
  var html = "";
  D.rooms.forEach(function (r, k) {
    html += '<div class="bay" style="left:' + (1080 * k) + 'px"><div class="light"></div>';
    if (k === 0 && D.intro.text) {
      html += '<div class="head" id="intro"><div class="ln"><span class="w">' + esc(D.intro.text) + '</span></div></div>';
    }
    html += headHTML(k, r.head, "h" + k, k === 0 && !!D.intro.text);
    html += '<div class="frame" id="f' + k + '"><div class="mat"></div>' + artHTML(k, r) + '</div>';
    html += placardHTML(k, r) + '</div>';
  });
  wall.innerHTML = html;
  document.getElementById("hudlab").textContent = String(D.name).toUpperCase();
  var hud = document.getElementById("hud");
  D.rooms.forEach(function (r, k) {
    var el = document.createElement("div");
    el.className = "room"; el.id = "r" + k;
    el.textContent = k === D.rooms.length - 1 ? "FINAL ROOM" : "ROOM " + (k + 1);
    if (k === 0) el.style.opacity = "1";
    hud.appendChild(el);
  });

  // ---------------------------------------------------------------- timeline
  var tl = gsap.timeline({ paused: true });
  var WHIP = "power4.inOut";
  var blurEl = document.getElementById("hbf"), view = document.getElementById("view");
  var B = { v: 0 };
  function applyBlur() {
    if (B.v < 0.5) { view.style.filter = "none"; blurEl.setAttribute("stdDeviation", "0 0"); }
    else { blurEl.setAttribute("stdDeviation", B.v.toFixed(1) + " 0"); view.style.filter = "url(#hb)"; }
  }
  tl.set(wall, { x: 14 }, 0);
  function hold(bay, t, d) { tl.fromTo(wall, { x: -1080 * bay + 14 }, { x: -1080 * bay - 14, duration: Math.max(0.1, d), ease: "none", immediateRender: false }, t); }
  function pan(t, bay, dur) {
    tl.to(wall, { x: -1080 * bay + 14, duration: dur, ease: WHIP }, t);
    tl.to(B, { v: 60, duration: dur * 0.5, ease: "power2.in", onUpdate: applyBlur }, t);
    tl.to(B, { v: 0, duration: dur * 0.5, ease: "power2.out", onUpdate: applyBlur }, t + dur * 0.5);
  }
  function pop(sel, t, d) { tl.from(sel, { y: 70, opacity: 0, scale: 0.9, duration: d || 0.28, ease: "back.out(2)" }, t); }
  function $(id) { return document.getElementById(id); }

  var CARD = D.endcard.start;
  D.rooms.forEach(function (r, k) {
    var L = r.land, E = Math.min(r.end, CARD), span = Math.max(0.6, E - L);
    if (k > 0) pan(r.pan, k, r.pan !== null ? (r.land - r.pan) : 0.6);
    hold(k, L, (k + 1 < D.rooms.length ? D.rooms[k + 1].pan : END) - L);
    r.head.forEach(function (w, i) { pop($("h" + k + "w" + i), w.t, w.hl ? 0.3 : 0.28); });
    var m = r.motif;
    if (m === "circles") {
      var hl = r.head[r.head.length - 1].t;
      tl.from($("c" + k + "b"), { attr: { cx: 700 }, duration: Math.min(1.3, 0.4 * span), ease: "power2.out" }, L + 0.1);
      tl.from($("c" + k + "bt"), { attr: { x: 700 }, duration: Math.min(1.3, 0.4 * span), ease: "power2.out" }, L + 0.1);
      var sq = Math.max(L + 0.1 + Math.min(1.3, 0.4 * span), hl - 0.46);
      tl.to($("c" + k + "b"), { attr: { cx: 410 }, duration: 0.5, ease: "power3.inOut" }, sq);
      tl.to($("c" + k + "bt"), { attr: { x: 436 }, duration: 0.5, ease: "power3.inOut" }, sq);
      tl.fromTo($("c" + k + "g"), { scale: 1.0 }, { scale: 1.06, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, hl);
      // room 1 opens on a finished bay (placard already hung) so the lower third is never bare
      if (k > 0) tl.from($("p" + k), { opacity: 0, y: 16, duration: 0.4, ease: "power2.out" }, L + 0.3);
    } else if (m === "chart") {
      tl.fromTo($("hock" + k), { strokeDasharray: 1000, strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: Math.min(1.0, 0.4 * span), ease: "power1.in" }, L + 0.25);
      var tt = Math.min(L + 1.35, E - 0.45);
      tl.from($("ten" + k), { scale: 0.6, opacity: 0, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(3)" }, tt);
      tl.from($("p" + k), { opacity: 0, rotation: 5, y: 40, duration: 0.4, ease: "back.out(2)" }, L + 0.65);
      if (E - (L + 1.25) >= 1.3) tl.to($("p" + k), { rotation: -3.2, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, L + 1.25);
      tl.from($("rocket" + k), { x: -30, y: 30, opacity: 0, duration: 0.4, ease: "power3.out" }, Math.min(L + 1.55, E - 0.45));
    } else if (m === "terminal") {
      var f = Math.min(1, Math.max(0.3, (span - 0.3) / 1.75));
      var cmdText = D.terminal.cmd, cmd = $("cmd" + k), Tn = { n: 0 };
      tl.to(Tn, { n: cmdText.length, duration: 0.6 * f, ease: "none", onUpdate: function () { cmd.textContent = cmdText.slice(0, Math.round(Tn.n)); } }, L + 0.1);
      tl.set($("caret" + k), { opacity: 0 }, L + 0.85 * f);
      tl.to($("o" + k + "a"), { opacity: 1, duration: 0.15 }, L + 0.85 * f);
      tl.to($("o" + k + "b"), { opacity: 1, duration: 0.2 }, L + 1.25 * f);
      tl.from($("o" + k + "b"), { x: -30, duration: 0.3, ease: "power3.out" }, L + 1.25 * f);
      tl.to($("o" + k + "c"), { opacity: 1, duration: 0.3 }, L + 1.75 * f);
      tl.from($("p" + k), { opacity: 0, y: 16, duration: 0.4, ease: "power2.out" }, L + 0.3);
    } else if (m === "merge") {
      var mt = L + 0.35 * span, md = Math.min(1.1, 0.4 * span);
      tl.from($("m" + k + "a"), { attr: { cx: 215 }, duration: md, ease: "power3.inOut" }, mt);
      tl.from($("m" + k + "b"), { attr: { cx: 481 }, duration: md, ease: "power3.inOut" }, mt);
      tl.to($("m" + k + "la"), { attr: { x: 348 }, duration: md, ease: "power3.inOut" }, mt);
      tl.to($("m" + k + "lb"), { attr: { x: 348 }, duration: md, ease: "power3.inOut" }, mt);
      tl.to([$("m" + k + "la"), $("m" + k + "lb")], { opacity: 0, duration: 0.2 }, mt + md - 0.15);
      tl.from($("eq" + k), { opacity: 0, scale: 0.7, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(2.5)" }, mt + md - 0.05);
      tl.from($("p" + k), { opacity: 0, y: 16, duration: 0.4, ease: "power2.out" }, L + 0.3);
    } else {
      tl.from($("ktile"), { opacity: 0, y: 24, duration: 0.45, ease: "power2.out" }, L + 0.05);
      tl.from($("wm"), { opacity: 0, y: 14, duration: 0.45 }, L + 0.2);
      tl.from($("p" + k), { opacity: 0, y: 16, duration: 0.4, ease: "power2.out" }, L + 0.55);
    }
    // room labels (seek-safe sets)
    if (k > 0) { tl.set($("r" + k), { opacity: 1 }, r.pan + 0.45); tl.set($("r" + (k - 1)), { opacity: 0 }, r.pan + 0.45); }
  });

  // room 1 intro headline swap
  if (D.intro.text) {
    tl.to($("intro"), { y: -50, opacity: 0, duration: 0.2, ease: "power2.in" }, D.intro.swap);
    tl.set($("h0"), { opacity: 1 }, D.intro.swap);
  }

  // film grain stepped at 12 fps from a seeded sequence (canonical)
  var s = 49;
  for (var g = 0; g < Math.ceil(END * 12); g++) { s = (s * 1103515245 + 12345) % 2147483648; tl.set("#grain", { x: -(s % 200) + 100, y: -((s >> 8) % 200) + 100 }, g / 12); }

  // end card (kit/endcard.js) by a hard cut, then a slow push so the hold never freezes
  var plan = KAEndCard.plan({ lastWordEnd: D.lastWordEnd, start: D.endcard.start, hold: D.endcard.hold, fps: FPS });
  if (Math.abs(plan.end - END) > 0.5 / FPS) throw new Error("style N: data-duration " + END + " != end-card plan end " + plan.end);
  var card = KAEndCard.mount({ tl: tl, root: root, start: plan.start, brand: D.brand });
  var logo = card.querySelector(".ka-endcard-logo");
  if (logo) tl.to(logo, { scale: 1.07, duration: Math.max(0.1, END - plan.start - 0.4), ease: "none" }, plan.start + 0.4);
  var cname = card.querySelector(".ka-endcard-name");
  if (cname) tl.fromTo(cname, { scale: 1 }, { scale: 1.06, duration: Math.max(0.1, END - plan.start), ease: "none", immediateRender: false }, plan.start);
  tl.set({}, {}, END);
  // The timeline is registered synchronously: the HyperFrames runtime (and the legibility
  // preflight's seek) bind to window.__timelines at load and miss a timeline added later.
  window.__timelines["main"] = tl;

  // Headline fit: shrink a headline line wider than 1000 px (font metrics only; no tween changes).
  function fitHeads() {
    Array.prototype.forEach.call(document.querySelectorAll(".head"), function (h) {
      var size = 104, widest = 0;
      Array.prototype.forEach.call(h.querySelectorAll(".ln"), function (ln) { widest = Math.max(widest, ln.scrollWidth); });
      if (widest > 1000) { size = Math.max(72, Math.floor(104 * 1000 / widest)); h.style.fontSize = size + "px"; }
    });
  }
  if (document.fonts && document.fonts.load) {
    Promise.all(["600 104px KSerif", "400 44px \"KS Shanns\"", "400 54px \"KS Lilita\""].map(function (f) { return document.fonts.load(f); })).then(fitHeads, fitHeads);
  } else { fitHeads(); }
  window.__cues = { lands: D.rooms.map(function (r) { return r.land; }), card: plan.start };
})();
</script>
