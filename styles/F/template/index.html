  __F_TITLE__ and the F_DATA literal. The canvas world below is r2-15s-F's world code
  unchanged, run on its own original clock (ORIG); the template warps real time onto that
  clock act by act (DATA.bounds), so every beat-locked world move lands on the new acts.
  Headlines are built from the narration's words and enter at the spoken word starts.
  Fonts (D4): the deliberately bad "KF Slop" face is the bundled OFL Comic Shanns (the
  canonical used an unlicensed system face); the unused marker face is dropped. KF Display / KF Mono stay the macOS
  Avenir Next / Menlo faces (not on the D4 list; licence unverified, see styles.json).
  End card: kit/endcard.js by a hard cut; audio from kit/sfx_bus.py.

<script src="kit/gsap.min.js"></script>
<script src="kit/endcard.js"></script>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

    // ---- camera: r2-15s-F's path on its own clock, placed through fwd() ----
    tl.to(cam, { yaw: 62, duration: Math.max(0.1, ec), ease: "none" }, 0);
    tl.fromTo(cam, { s: 3.4, x: -440, y: -120, z: 200, yo: -25 }, { s: 1.30, x: 0, y: 20, z: 60, yo: 0, duration: fd(0, 1.3), ease: "expo.out", immediateRender: false }, 0);
    tl.to(cam, { s: 1.40, duration: fd(1.3, 2.0), ease: "sine.inOut" }, fwd(1.3));
    tl.to(cam, { x: -150, y: 340, z: 40, s: 3.0, duration: fd(T.more - 0.3, 0.7), ease: "power3.inOut" }, fwd(T.more - 0.3));
    tl.to(cam, { x: -70, y: -236, z: 0, s: 2.55, pitch: 76, yo: -43, duration: fd(T.its - 0.2, 0.8), ease: "power3.inOut" }, fwd(T.its - 0.2));
    tl.to(cam, { s: 2.75, yo: -46, duration: fd(T.its + 0.6, 2.4), ease: "sine.inOut" }, fwd(T.its + 0.6));
    tl.to(cam, { x: 0, y: 0, z: 70, s: 1.65, pitch: 31, yo: 0, duration: fd(T.says, 0.75), ease: "power3.inOut" }, fwd(T.says));
    tl.to(cam, { s: 1.75, duration: fd(T.says + 0.75, 1.2), ease: "sine.inOut" }, fwd(T.says + 0.75));
    tl.to(cam, { x: 390, y: 60, z: -60, s: 2.3, duration: fd(T.and - 0.15, 0.9), ease: "power3.inOut" }, fwd(T.and - 0.15));
    tl.to(cam, { s: 2.85, duration: fd(T.and + 0.75, 1.0), ease: "sine.inOut" }, fwd(T.and + 0.75));
    tl.to(cam, { x: 0, y: 0, z: 40, s: 1.2, duration: fd(T.heres - 0.1, 1.0), ease: "power3.inOut" }, fwd(T.heres - 0.1));

    // ---- headlines: one per act, words at their spoken starts ----
    for (var k = 0; k < 6; k++) {
      var at = k === 0 ? Math.min(0.25, Math.max(0, B[1] - 0.6)) : B[k] - 0.04;
      inHL(tl, k, at);
      if (k === 1) {
        var last = flat(DATA.acts[1]).slice(-1)[0];
        tl.fromTo("#slopsub", { opacity: 0, rotation: 12 }, { opacity: 1, rotation: 3, duration: 0.2, ease: "bounce.out", immediateRender: false },
                  Math.min(B[2] - 0.45, (last ? last.t : B[1]) + 0.35));
      }
      if (k < 5) outHL(tl, k, B[k + 1] - 0.22);
    }

    // ---- chips (F's run / health chips on the warped clock, plus an act chip) ----
    tl.fromTo("#runchip", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, fwd(T.rigorous - 0.1));
    var sv = document.getElementById("stepv");
    STEP_T.forEach(function (s, i) { tl.set(sv, { textContent: (i + 1) + "/6" }, fwd(s)); });
    tl.set(sv, { textContent: "5/5 checks" }, fwd(T.check));
    tl.to("#runchip", { opacity: 0, duration: 0.25 }, fwd(T.and - 0.1));
    tl.fromTo("#health", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, fwd(T.leaves));
    var hv = document.getElementById("hv"), hp = { v: 92 };
    tl.to(hp, { v: 61, duration: fd(T.worse - 0.1, 0.9), ease: "power2.inOut", onUpdate: function () { hv.textContent = Math.round(hp.v) + (hp.v < 91 ? " ▼" : ""); } }, fwd(T.worse - 0.1));
    tl.to("#health", { opacity: 0, duration: 0.3 }, fwd(T.heres - 0.2));
    var actn = document.getElementById("actn"), actk = document.getElementById("actk");
    tl.fromTo("#actchip", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, 0);
    DATA.acts.forEach(function (a, i) {
      tl.set(actn, { textContent: pad2(i + 1) + "/06" }, B[i]);
      tl.set(actk, { textContent: a.chip }, B[i]);
    });

    // ---- end card: kit/endcard.js, hard cut at DATA.endcard.start ----
    var plan = KAEndCard.plan({ lastWordEnd: DATA.lastWordEnd, start: ec, hold: DATA.endcard.hold, fps: FPS });
    if (Math.abs(plan.end - END) > 0.5 / FPS) throw new Error("style F: data-duration " + END + " != end-card plan end " + plan.end);
    var card = KAEndCard.mount({ tl: tl, root: document.getElementById("root"), start: plan.start, brand: DATA.brand });
    var logo = card.querySelector(".ka-endcard-logo"), cname = card.querySelector(".ka-endcard-name");
    tl.to(logo, { scale: 1.07, duration: Math.max(0.1, END - plan.start - 0.4), ease: "none" }, plan.start + 0.4);
    if (cname) tl.fromTo(cname, { scale: 1 }, { scale: 1.06, duration: Math.max(0.1, END - plan.start), ease: "none", immediateRender: false }, plan.start);
    document.getElementById("ecfoot-t").textContent = DATA.footer;
    tl.set("#ecfoot", { autoAlpha: 1 }, plan.start);
    tl.fromTo("#ecfoot .rule", { scaleX: 0.3 }, { scaleX: 1.8, duration: Math.max(0.1, END - plan.start), ease: "none", immediateRender: false }, plan.start);

    // ---- master clock: the canvas world runs on the original clock via inv() ----
    var grain = document.getElementById("grain"), clock = { t: 0 };
    tl.to(clock, { t: END, duration: END, ease: "none", onUpdate: function () {
      render(inv(clock.t));
      var n = Math.floor(clock.t * 15); grain.style.transform = "translate(" + ((n * 73) % 200 - 100) + "px," + ((n * 131) % 200 - 100) + "px)";
    } }, 0);
    tl.set({}, {}, END);
    render(0);
    window.__timelines["main"] = tl;
  }

  // The timeline must exist synchronously: the HyperFrames runtime binds window.__timelines
  // at startup, and a timeline registered later (e.g. after a fonts promise) is never seeked.
  // Fonts only affect headline fitting (re-run when they are ready) and canvas text, which
  // is redrawn on every seek.
  build();
  function refit() { fit(".big", 64); fit(".slop", 96); }
  var fl = ["800 40px 'KF Display'", "600 40px 'KF Display'", "400 20px 'KF Mono'", "700 20px 'KF Mono'", "700 20px 'KF Slop'", "400 40px 'KS Lilita'"];
  Promise.all(fl.map(function (f) { return document.fonts.load(f); })).then(refit, refit);
})();
</script>
