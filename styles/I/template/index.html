<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080, height=1920"/>
<title>Style I: Swiss modernist motion poster</title>
<!--
  Style I template (canonical: the reference lookdev). Instantiated by styles/I/build.py, which
  replaces the __I_*__ placeholders: the poster plan (window.__I) and the composition length.
  Five flat colour fields (cream, navy, cream, graphite, cream) wipe in on scene edges fitted to
  the narration; flush-left grotesk type rises out of masks on its own words; red #E2231A is the
  only signal colour; geometric primitives (sun, orbiting ring, two models + check bar, rings
  that merge, three bars) fill the lower frame; a sloppy "lgtm" break tilts the grid in scene 3.
  Fonts (D4): the gag faces are the bundled OFL Comic Shanns and Virgil (kit/fonts).
  Helvetica Neue / Avenir Next stay as macOS local() faces (not on the D4 list; license
  unverified, see styles.json). The shared end card is kit/endcard.js.
-->
<script src="kit/gsap.min.js"></script>
<script src="kit/endcard.js"></script>
<style>
@font-face { font-family: "KSwiss"; src: local("HelveticaNeue-Medium"), local("Helvetica Neue Medium"); font-weight: 500; }
@font-face { font-family: "KSwiss"; src: local("HelveticaNeue-Bold"), local("Helvetica Neue Bold"); font-weight: 700; }
@font-face { font-family: "KHeavy"; src: local("AvenirNext-Heavy"), local("Avenir Next Heavy"); font-weight: 800; }
@font-face { font-family: "KS Shanns"; font-weight: 300 900; src: url("assets/fonts/ComicShanns.woff2") format("woff2"); }
@font-face { font-family: "KS Virgil"; font-weight: 300 900; src: url("assets/fonts/Virgil.woff2") format("woff2"); }
@font-face { font-family: "KS Lilita"; font-weight: 400 900; src: url("assets/fonts/LilitaOne.woff2") format("woff2"); }
:root { --cream:#FBF7F0; --navy:#0F1B2D; --navy2:#10243E; --graphite:#202020; --red:#E2231A; --slop:#FFE14D; --slopink:#FF2EA6; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:var(--cream); }
#root { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--cream); font-family:"KSwiss"; color:var(--navy); }
.sc { position:absolute; inset:0; overflow:hidden; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; }
.abs { position:absolute; }
.m { position:absolute; overflow:hidden; }
.m > span { display:block; will-change:transform; white-space:nowrap; }
.disp { font-weight:700; letter-spacing:-0.055em; line-height:0.86; }
.heavy { font-family:"KHeavy"; font-weight:800; letter-spacing:-0.06em; line-height:1; }
.lab { font-weight:700; font-size:52px; letter-spacing:-0.01em; }
.body { font-weight:500; font-size:90px; letter-spacing:-0.025em; line-height:1.1; }
#grid { position:absolute; inset:0; pointer-events:none; z-index:50; transform-origin:540px 960px; }
#grid i { position:absolute; top:0; bottom:0; width:2px; background:rgba(226,35,26,0.13); }
#grid b { position:absolute; left:0; right:0; height:2px; background:rgba(226,35,26,0.10); }
#folio { position:absolute; inset:0; z-index:60; pointer-events:none; mix-blend-mode:difference; color:#fff; }
#folio .f { position:absolute; font-weight:700; font-size:46px; letter-spacing:-0.01em; top:62px; }
#grain { position:absolute; left:-200px; top:-200px; width:1480px; height:2320px; z-index:9500; pointer-events:none; opacity:0.5; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  1.6 0 0 0 -0.35'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
.dot { position:absolute; border-radius:50%; }
.slop { font-family:"KS Shanns"; font-weight:700; }
.marker { font-family:"KS Virgil"; font-weight:700; }
/* keep the faces warm before layout is measured (off-screen, invisible, skipped by the legibility preflight) */
#warm { position:absolute; left:-4000px; top:0; opacity:0; font-size:44px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-fps="30" data-duration="__I_DURATION__">
  <div id="warm" data-legibility="ignore" aria-hidden="true">
    <span style="font-family:'KSwiss'; font-weight:500">a</span><span style="font-family:'KSwiss'; font-weight:700">a</span>
    <span style="font-family:'KHeavy'; font-weight:800">a</span><span class="slop">a</span><span class="marker">a</span>
    <span style="font-family:'KS Lilita'">a</span>
  </div>

  <!-- S1 cream: the red sun -->
  <div class="sc" id="s1" style="background:var(--cream)">
    <div class="dot" id="s1dot" style="left:400px; top:1130px; width:620px; height:620px; background:var(--red)"></div>
    <div class="abs" id="s1bar" style="left:0; width:1080px; height:28px; background:var(--navy); transform-origin:0 50%"></div>
  </div>

  <!-- S2 navy: the loop -->
  <div class="sc" id="s2" style="background:var(--navy); color:var(--cream)">
    <div class="abs" id="s2rule" style="left:72px; width:936px; height:20px; background:var(--red); transform-origin:0 50%"></div>
    <div class="dot" id="s2ring" style="left:220px; top:1120px; width:640px; height:640px; border:28px solid var(--cream)"></div>
    <div class="abs" id="s2orb" style="left:220px; top:1120px; width:640px; height:640px"><div class="dot" style="left:290px; top:-22px; width:60px; height:60px; background:var(--red)"></div></div>
  </div>

  <!-- S3 cream: two models and a check, then the sloppy break -->
  <div class="sc" id="s3" style="background:var(--cream)">
    <div class="abs" id="s3g" style="inset:0; transform-origin:540px 960px">
      <div class="dot" id="mA" style="left:72px; top:1150px; width:400px; height:400px; background:var(--navy)"></div>
      <div class="dot" id="mB" style="left:608px; top:1150px; width:400px; height:400px; border:26px solid var(--navy)"></div>
      <div class="abs" id="chk" style="left:472px; top:1336px; width:136px; height:28px; background:var(--red); transform-origin:0 50%"></div>
      <div class="m" style="left:72px; top:1590px; width:440px; height:76px"><span class="lab" id="lA"></span></div>
      <div class="m" style="left:600px; top:1590px; width:480px; height:76px"><span class="lab" id="lB"></span></div>
    </div>
    <div class="abs slop" id="sticker" style="left:90px; top:1120px; width:900px; padding:26px 30px 30px; background:var(--slop); color:var(--slopink); line-height:1.0; border:8px dashed #3B7BFF; box-shadow:18px 18px 0 #3B7BFF; text-align:center; opacity:0; visibility:hidden">
      <div id="gbig" style="font-size:176px; letter-spacing:-0.02em"></div><div id="gsub" style="font-size:66px; margin-top:6px"></div><div id="gtick" style="font-size:58px; color:#2A9D3A; margin-top:10px"></div>
    </div>
    <div class="abs marker" id="scrawl" style="left:560px; top:960px; color:#FF2EA6; font-size:84px; transform:rotate(14deg); opacity:0; visibility:hidden"></div>
  </div>

  <!-- S4 graphite: two rings become one -->
  <div class="sc" id="s4" style="background:var(--graphite); color:var(--cream)">
    <div class="dot" id="s4A" style="left:72px; top:1250px; width:420px; height:420px; border:26px solid var(--cream)"></div>
    <div class="dot" id="s4B" style="left:588px; top:1250px; width:420px; height:420px; border:26px solid var(--cream)"></div>
  </div>

  <!-- S5 cream: three bars -->
  <div class="sc" id="s5" style="background:var(--cream)">
    <div class="abs bar" style="left:72px; top:1150px; width:296px; height:600px; background:var(--navy); transform-origin:50% 100%"></div>
    <div class="abs bar" style="left:392px; top:1150px; width:296px; height:600px; background:var(--navy2); transform-origin:50% 100%"></div>
    <div class="abs bar" style="left:712px; top:1150px; width:296px; height:600px; background:var(--red); transform-origin:50% 100%"></div>
    <div class="abs lab barl" style="left:96px; top:1660px; color:var(--cream)"></div>
    <div class="abs lab barl" style="left:416px; top:1660px; color:var(--cream)"></div>
    <div class="abs lab barl" style="left:736px; top:1660px; color:var(--cream)"></div>
  </div>

  <div id="grid"></div>
  <div id="folio">
    <div class="f" id="fl" style="left:72px"></div>
    <div class="f" id="pg" style="right:72px">01 / 05</div>
  </div>
  <div id="grain"></div>

  <audio id="vo" src="assets/voice_norm.wav" data-start="0" data-duration="__I_VO_DURATION__" data-volume="1"></audio>
  <audio id="sfx" src="assets/sfx_bus.wav" data-start="0" data-duration="__I_DURATION__" data-volume="1"></audio>
</div>
<script>window.__I = /*__I_DATA__*/null;</script>
<script>
(function () {
  "use strict";
  window.__timelines = window.__timelines || {};
  var D = window.__I;
  if (!D) throw new Error("style I: no plan (window.__I); run styles/I/build.py");
  var root = document.getElementById("root");
  var END = Number(root.getAttribute("data-duration"));
  var FPS = D.fps || 30;
  var B = D.bounds;
  var TEXT_TOP = 196, TEXT_BOTTOM = 1090;
  function $(id) { return document.getElementById(id); }

  var g = $("grid");
  for (var c = 0; c < 7; c++) { var gi = document.createElement("i"); gi.style.left = (72 + c * 160 - (c == 6 ? 26 : 0)) + "px"; g.appendChild(gi); }
  for (var r = 0; r < 15; r++) { var gb = document.createElement("b"); gb.style.top = (96 + r * 128) + "px"; g.appendChild(gb); }

  // static texts from the plan (brand keys are script-agnostic inputs)
  var P = D.poster;
  $("fl").textContent = P.folio;
  $("lA").textContent = P.pair[0]; $("lB").textContent = P.pair[1];
  $("gbig").textContent = P.gag.big; $("gsub").textContent = P.gag.sub; $("gtick").textContent = P.gag.tick;
  $("scrawl").textContent = P.gag.scrawl;
  var bl = document.querySelectorAll("#s5 .barl");
  for (var q = 0; q < 3; q++) bl[q].textContent = P.bars[q];

  // ---- layout: per scene, body lines then display lines, fitted to the width and the text band
  function mkLine(scene, cls, text, size, extra) {
    var m = document.createElement("div");
    m.className = "m";
    var s = document.createElement("span");
    s.className = cls;
    s.textContent = text;
    s.style.fontSize = size + "px";
    if (extra) for (var k in extra) s.style[k] = extra[k];
    m.appendChild(s);
    scene.appendChild(m);
    return { m: m, s: s };
  }
  // a block span reports its container width, so measure the glyph run itself
  function natural(el) { var r = document.createRange(); r.selectNodeContents(el.s); return r.getBoundingClientRect().width; }

  var LINES = [];   // {el, t, kind}
  var textBottoms = [];
  function layout() {
    D.scenes.forEach(function (S, k) {
      var sc = $("s" + (k + 1)), dark = S.field === "navy" || S.field === "graphite";
      var host = k === 2 ? $("s3g") : sc;
      var items = [];
      S.lead.forEach(function (ln) {
        var el = mkLine(host, "body", ln.text, 90);
        items.push({ el: el, ln: ln, kind: "body", max: 90, floor: 56, width: 936 });
      });
      S.disp.forEach(function (ln) {
        var heavy = !!ln.heavy;
        var el = mkLine(host, heavy ? "heavy" : "disp", ln.text, heavy ? 400 : 220,
                        ln.red ? { color: "#E2231A" } : (dark ? { color: "#FBF7F0" } : null));
        items.push({ el: el, ln: ln, kind: heavy ? "heavy" : "disp", max: heavy ? 400 : 220, floor: 104, width: heavy ? 980 : 940 });
      });
      // fit each line to its width
      items.forEach(function (it) {
        var w = natural(it.el);
        var size = it.max;
        if (w > it.width) size = Math.floor(it.max * it.width / w);
        it.size = Math.max(it.floor, size);
      });
      function pitch(it) { return it.kind === "body" ? it.size * 1.24 : (it.kind === "heavy" ? it.size * 0.98 : it.size * 0.94); }
      var total = 0, gap = 18;
      items.forEach(function (it, i) { total += pitch(it) + (i && it.kind !== items[i - 1].kind ? gap : 0); });
      var avail = TEXT_BOTTOM - TEXT_TOP;
      if (total > avail) {
        var f = avail / total;
        items.forEach(function (it) { it.size = Math.max(it.kind === "body" ? 52 : 96, Math.floor(it.size * f)); });
      }
      var y = TEXT_TOP;
      items.forEach(function (it, i) {
        if (i && it.kind !== items[i - 1].kind) y += gap;
        var h = it.kind === "body" ? it.size * 1.24 : it.size * 1.08;
        var left = it.kind === "body" ? 72 : (it.kind === "heavy" ? 40 : 60);
        it.el.s.style.fontSize = it.size + "px";
        it.el.m.style.left = left + "px";
        it.el.m.style.top = Math.round(y) + "px";
        it.el.m.style.width = (1080 - left) + "px";
        it.el.m.style.height = Math.ceil(h) + "px";
        y += pitch(it);
        LINES.push({ s: it.el.s, t: it.ln.t, kind: it.kind });
      });
      textBottoms.push(Math.min(TEXT_BOTTOM, Math.round(y)));
    });
  }

  function build() {
    layout();
    var tl = gsap.timeline({ paused: true });
    var SN = "expo.out", WP = "power4.inOut";
    function up(el, t, d) {
      d = d || 0.55;
      tl.fromTo(el, { yPercent: 140 }, { yPercent: 0, duration: d, ease: SN }, t);
      tl.fromTo(el, { filter: "blur(16px)" }, { filter: "blur(0px)", duration: d * 0.7, ease: "power2.out" }, t);
    }
    function bar(sel, t, d) { tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: d || 0.5, ease: SN }, t); }
    function pop(sel, t, d) {
      d = d || 0.5;
      tl.fromTo(sel, { scale: 0 }, { scale: 1, duration: d, ease: SN }, t);
      tl.fromTo(sel, { filter: "blur(14px)" }, { filter: "blur(0px)", duration: d * 0.7, ease: "power2.out" }, t);
    }
    // soft-edged mask wipes (the soft edge is the motion blur of the wipe)
    var WIPES = {
      left: { grad: "linear-gradient(90deg,#000 0,#000 1080px,transparent 1512px)", size: "3240px 100%", from: [-1512, 0], to: [0, 0] },
      down: { grad: "linear-gradient(180deg,#000 0,#000 1920px,transparent 2688px)", size: "100% 5760px", from: [0, -2688], to: [0, 0] },
      up:   { grad: "linear-gradient(0deg,#000 0,#000 1920px,transparent 2688px)", size: "100% 5760px", from: [0, 0], to: [0, -3840] }
    };
    function wipe(k, t, dir) {
      var el = $("s" + (k + 1)), prev = $("s" + k), w = WIPES[dir], p = { k: 0 };
      function ap() {
        var x = w.from[0] + (w.to[0] - w.from[0]) * p.k, y = w.from[1] + (w.to[1] - w.from[1]) * p.k;
        var pos = x + "px " + y + "px";
        el.style.webkitMaskPosition = pos; el.style.maskPosition = pos;
      }
      el.style.webkitMaskImage = w.grad; el.style.maskImage = w.grad;
      el.style.webkitMaskSize = w.size; el.style.maskSize = w.size;
      ap();
      // scenes are stacked: a scene is only visible from its wipe on, and the one under it
      // is hidden once the wipe has covered it (so the DOM matches the picture)
      tl.set(el, { autoAlpha: 0 }, 0);
      tl.set(el, { autoAlpha: 1 }, t - 0.28);
      tl.to(p, { k: 1, duration: 0.55, ease: "power3.inOut", onUpdate: ap }, t - 0.28);
      tl.set(prev, { autoAlpha: 0 }, t + 0.3);
    }
    var dirs = ["left", "up", "down", "left"];
    D.wipes.forEach(function (t, i) { wipe(i + 1, t, dirs[i]); });

    // type: every line rises out of its mask on its first word
    LINES.forEach(function (L) { up(L.s, L.t, L.kind === "body" ? 0.55 : 0.6); });

    var V = D.devices;
    // S1: the red sun grows from frame 0, crops off the right edge, slides left, drifts
    tl.fromTo("#s1dot", { scale: 0.5 }, { scale: 1, duration: 0.8, ease: SN }, 0.0);
    tl.fromTo("#s1dot", { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.5 }, 0.0);
    tl.to("#s1dot", { scale: 1.3, x: 170, y: -40, duration: 0.6, ease: WP }, V.s1.crop);
    tl.to("#s1dot", { scale: 0.9, x: -330, y: 0, duration: 0.65, ease: WP }, V.s1.slide);
    tl.to("#s1dot", { scale: 1.1, x: -300, duration: Math.max(0.4, B[1] - V.s1.slide - 0.65), ease: "power1.in" }, V.s1.slide + 0.65);
    $("s1bar").style.top = (textBottoms[0] + 10) + "px";
    bar("#s1bar", 0.1, 0.6);
    // constant-speed drifts on `top` (no clash with the x/scale moves): the poster never holds
    // perfectly still between beats, so no gap reads as a freeze (preflight/dead_frames.py)
    function drift(sel, a, b, t0, t1) { tl.fromTo(sel, { top: a }, { top: b, duration: Math.max(0.1, t1 - t0), ease: "none", immediateRender: false }, t0); }
    drift("#s1dot", 1170, 1050, 0, B[1] + 0.3);

    // S2: rule under the type, ring up as the wipe lands, red dot orbits to the scene end
    $("s2rule").style.top = (textBottoms[1] + 30) + "px";
    bar("#s2rule", V.s2.rule);
    pop("#s2ring", V.s2.ring, 0.7);
    tl.fromTo("#s2orb", { rotation: 0, opacity: 0 }, { rotation: 630, opacity: 1, duration: V.s2.orbit[1] - V.s2.orbit[0], ease: "power2.inOut" }, V.s2.orbit[0]);

    // S3: diagram, then the sloppy break, then the snap back
    pop("#mA", V.s3.a); pop("#mB", V.s3.b);
    drift("#mA", 1190, 1110, B[2] - 0.3, B[3] + 0.3); drift("#mB", 1190, 1110, B[2] - 0.3, B[3] + 0.3);
    drift("#chk", 1376, 1296, B[2] - 0.3, B[3] + 0.3);
    bar("#chk", V.s3.chk, 0.4);
    up($("lA"), V.s3.a + 0.2); up($("lB"), V.s3.b + 0.1);
    tl.to("#grid", { rotation: -7, x: 40, y: -20, duration: 0.3, ease: "back.out(3)" }, V.s3.gag - 0.15);
    tl.to("#s3g", { rotation: 7, x: -20, duration: 0.3, ease: "back.out(3)" }, V.s3.gag - 0.15);
    tl.fromTo("#sticker", { scale: 2.6, rotation: 20, autoAlpha: 0, filter: "blur(10px)" }, { scale: 1, rotation: -5, autoAlpha: 1, filter: "blur(0px)", duration: 0.4, ease: "back.out(1.4)" }, V.s3.gag);
    tl.fromTo("#scrawl", { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "back.out(3)" }, V.s3.scrawl);
    tl.set("#lB", { textContent: P.gag.swap, className: "slop", fontSize: 48, color: "#FF2EA6" }, V.s3.swap);
    tl.to("#grid", { rotation: 0, x: 0, y: 0, duration: 0.22, ease: "expo.out" }, V.s3.snap);
    tl.to("#s3g", { rotation: 0, x: 0, duration: 0.22, ease: "expo.out" }, V.s3.snap);

    // S4: two rings; on the accent word they merge into one red ring
    pop("#s4A", V.s4.a); pop("#s4B", V.s4.b);
    tl.to("#s4B", { x: -516, duration: 0.32, ease: SN }, V.s4.merge);
    tl.to(["#s4A", "#s4B"], { borderColor: "#E2231A", duration: 0.08 }, V.s4.merge);
    tl.fromTo("#s4A", { scale: 1 }, { scale: 1.1, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, V.s4.merge + 0.12);
    // slow breathing after the merge so the frame keeps moving until the next wipe
    drift(["#s4A", "#s4B"], 1300, 1200, B[3] - 0.3, B[4] + 0.3);

    // S5: three bars on the wipe, labels after
    var bars = document.querySelectorAll("#s5 .bar");
    V.s5.bars.forEach(function (t, k) {
      tl.fromTo(bars[k], { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: SN }, t);
      tl.fromTo(bars[k], { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.35 }, t);
    });
    tl.fromTo("#s5 .barl", { opacity: 0 }, { opacity: 1, duration: 0.15, stagger: 0.12 }, V.s5.labels);
    tl.to("#s5 .bar", { scaleY: 0.94, duration: Math.max(0.3, B[5] - V.s5.labels - 0.3), stagger: 0.1, ease: "none" }, V.s5.labels + 0.3);

    // folio counter
    D.wipes.forEach(function (t, i) { tl.set("#pg", { textContent: "0" + (i + 2) + " / 05" }, t); });

    // film grain: reposition at 12 fps with a seeded sequence (deterministic), over the whole piece
    var s = 49, nf = Math.ceil(END * 12);
    for (var f = 0; f <= nf; f++) {
      s = (s * 1103515245 + 12345) % 2147483648;
      var gx = -(s % 200), gy = -((s >> 8) % 200);
      tl.set("#grain", { x: gx + 100, y: gy + 100 }, f / 12);
    }

    // end card (kit/endcard.js): hard cut, Swiss red rule + folio in the lower frame, slow push
    var plan = KAEndCard.plan({ lastWordEnd: D.lastWordEnd, fps: FPS });
    if (Math.abs(plan.end - END) > 0.5 / FPS || Math.abs(plan.start - D.endcard.start) > 1e-3) {
      throw new Error("style I: data-duration " + END + " / plan " + D.endcard.start + " != KAEndCard.plan " + plan.start + "-" + plan.end);
    }
    var card = KAEndCard.mount({ tl: tl, root: root, start: plan.start, brand: D.brand });
    var rule = document.createElement("div");
    rule.style.cssText = "position:absolute;left:72px;top:1560px;width:936px;height:24px;background:#E2231A;transform-origin:0 50%;";
    card.appendChild(rule);
