<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080, height=1920"/>
<title>Style S: Teletext pages, __S_TITLE__</title>
<!--
  Style S template (canonical look: the reference lookdev, read only). A 1980s text service
  (KTEXT) on a 40x24 grid: one page per narration chapter, painted on a canvas by draw(t) from a
  paused GSAP clock, with a fastext key press, a rolling page counter and a top-down repaint on
  every page turn, a CRT jolt and roll bar, phosphor glow, scanlines and curvature.
  build.py injects the plan (D) derived from the words file; nothing here is S49-specific.
  Changes from the canonical: body text and captions use the bundled OFL Comic Shanns (was the
  system Andale Mono), the sloppy note uses the bundled OFL Virgil, DOM captions are 46 px (were
  30 px), the mosaic face gained J/Q/Z, digits and . ! - ' glyphs, and the canvas P999 end page
  is replaced by the shared kit/endcard.js, cut in 0.1 s after the last word and held 2 s with a
  slow push so the hold never freezes. During the camera pushes only the top caption fades; the
  bottom caption stays up so the lower third never empties while the zoomed screen is full-bleed.
-->

<script src="kit/endcard.js"></script>
