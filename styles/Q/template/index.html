<title>Style Q: Handheld LCD, __Q_TITLE__</title>
<!--
  Style Q template, from the canonical look (read only). Instantiate with styles/Q/build.py, which
  writes the cue plan into window.__Q and the composition length into every data-duration. Do not
  edit an instantiated copy by hand.

  The look is unchanged in kind: a 1989-style dot-matrix handheld. The 112x192 LCD is a canvas drawn
  at an exact 8x integer scale (896x1536, pixelated) inside a cream console shell with a navy screen
  plate, LED, D-pad, A/B buttons, SELECT/START pills and the official K tile + wordmark. Only the
  four LCD shades are drawn on screen (Bayer dithering for anything between), all screen type is
  the 5x7 bitmap table, inversion is a palette flip, scene changes are 5-frame band wipes with
  content on both sides, and every frame is a pure function of t (seek-safe LCD ghosting from t-1f
  and t-2f, never across a hard cut).

  Script-agnostic: build.py splits the words into five chapters and derives every cue time and
  every line of screen copy from them; the menu items, the LGTM verdict and the model names are
  default copy, overridable with --content.

  Preflight fixes vs the canonical look:
  - dead frames: the K tile bobs after it lands (the canonical boot froze 0.83-2.0 s), the menu
    cursor steps at most every 0.4 s, and the floors in the check, verdict, slam and bank screens
    scroll (the canonical slam screen froze 12.33-12.97 s);
  - end card: the canonical in-LCD card started at 13.56 s, over the last words, and held 0.03 s
    after the last word. It is replaced by the shared kit/endcard.js, cut in 0.1 s after the last
    word and held 2 s, carrying the title and a blinking PRESS START (no frozen hold, and the lower
    third is filled); the bank beat now runs to the card instead of being squeezed to 0.6 s;
  - small type: the DOM console labels were 16-26 px (plate strip 26, SELECT/START 16, A/B 24). The
    plate strip is now 44 px (the screen moved down 24 px to make room), A/B are 44 px printed on
    the buttons, and the SELECT/START captions are dropped (the pills stay);
  - motion: the slam word and the X-eyed robots shake, the ITEM GET key bobs, and the end card
    pushes in slowly under the blinking PRESS START (the LCD floor shades are too close to count);
  - loudness: one bus from kit/sfx_bus.py (voice at -14 LUFS, SFX 14 dB under the voice peak).
  Fonts (D4): the canonical's Futura (local(), plate strip, wordmark, button labels) is swapped
  for the bundled OFL Lilita One. Screen type is the bitmap table and needs no font.
-->
