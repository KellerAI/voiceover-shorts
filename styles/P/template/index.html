<title>Style P: VHS camcorder tape, __P_TITLE__</title>
<!--
  Style P template, from the canonical look (read only). Instantiate with styles/P/build.py, which
  writes the chapter plan into window.__P and the composition length into every data-duration. Do
  not edit an instantiated copy by hand.

  The look is unchanged in kind: home-video tape playback with a persistent OSD (blinking REC,
  running timecode, SP/STOP, date stamp), CRT scanlines, a per-frame seeded noise canvas, chroma
  bleed, a drifting head-switch band, and tracking-error rolls (skew, jitter, vertical roll, blur and
  saturation spike, tear band, FF/REW glyph) at every cut. Six scenes keep their devices: a 0.6 s
  blue PLAY screen; a cassette whose cream label gets the title written on in red marker, over a
  NOW PLAYING panel; a chapter headline over a REPEAT COUNTER panel; a headline over two CRT TVs
  where a reviewer set stamps a sloppy "LGTM!!" on wrong work; a cream brief card with a headline
  stack and one boxed slam word with shake; a final panel whose key word slams in.

  Script-agnostic: build.py splits the words into five chapters at clause ends (balanced, at least
  1.6 s each) and derives every line of copy and every cue time from the words; the S49 gag decor
  (doc lines, LGTM stamp, reviewer line) is default copy, overridable with --content.

  Preflight fixes vs the canonical look: every text run renders >= 44 px at 1080 wide (panel
  headers 32 -> 48 px, chips 36 -> 48, label stripe 26 -> 46, TV knobs 30 -> 48, TV names 32 -> 48,
  counter caption 30 -> 48, brief-card header 30 -> 48, SP/STOP 44 -> 48), and every auto-fit has a
  floor (data-min) while build.py caps line lengths so the floor is never hit; the PLAY panel no
  longer starts at 0.9 scale; the canonical in-scene Keller tile (1.6 s hold, faded in over a roll)
  is replaced by the shared kit/endcard.js, cut in 0.1 s after the last word and held 2 s with a
  slow push under the scanlines and noise, so the hold never freezes; its default background is
  brand cream (#FBF7F0) so the cut from the navy tape scenes is a hard scene change; the lower
  third carries a framed element in every scene (PLAY: tracking line; final chapter: a TAPE
  REMAINING panel); and the audio is one bus from kit/sfx_bus.py.
  Fonts (D4): the canonical's macOS faces are swapped for bundled OFL fonts: Andale Mono (OSD,
  counter, doc, knobs) -> Comic Shanns (monospace, so the timecode keeps its columns); Futura
  Condensed ExtraBold and Futura Bold (headlines, label stripe) -> Lilita One; Marker Felt (tape
  label) -> Virgil; Comic Sans MS (the sloppy LGTM stamp) -> Comic Shanns bold, which keeps the
  deliberately "wrong font" joke. Avenir Next (the in-scene wordmark) went with the in-scene tile.
-->

 <div class="osd" id="mode" style="left:80px;top:190px;font-size:48px;color:#cfd9e6">SP</div>
 <div class="osd" id="trans" style="left:0;right:0;top:860px;text-align:center;font-size:170px;opacity:0">&#9654;&#9654;</div>
 <div class="osd" id="date" style="right:80px;bottom:190px;font-size:48px;text-align:right"></div>
 <audio id="vo" src="assets/voice_norm.wav" data-start="0" data-duration="__P_VO_DURATION__" data-volume="1"></audio>
 <audio id="sfx" src="assets/sfx_bus.wav" data-start="0" data-duration="__P_DURATION__" data-volume="1"></audio>
</div>
<script>
window.__P = /*__P_DATA__*/null;
(function () {
  window.__timelines = window.__timelines || {};
  var D = window.__P, FPS = 30;
  var root = document.getElementById("root");
  var END = parseFloat(root.getAttribute("data-duration"));
  var $ = function (i) { return document.getElementById(i); };
  var EC = D.endcard.start;
  var S = [$("s0"), $("s1"), $("s2"), $("s3"), $("s4"), $("s5")];
  var CUT = [0].concat(D.cuts).concat([END + 1]);
  var TR = D.cuts.map(function (c, i) { return { t: c, g: D.glyphs[i] }; });
  var C1 = D.ch1, C2 = D.ch2, C3 = D.ch3, C4 = D.ch4, C5 = D.ch5;
  function set(id, txt) { $(id).textContent = txt; }

  // static copy from the plan
  set("tapechip", D.tapeChip); set("stripe", D.brandName.toUpperCase()); set("tapelen", "T-120");
  set("l1", C1.l1.text); set("l2", C1.title.text); set("npmode", "T-120 · SP");
  set("c2chip", "CHAPTER 2"); $("h1").innerHTML = ""; C2.head.forEach(function (ln, i) { if (i) $("h1").appendChild(document.createElement("br")); $("h1").appendChild(document.createTextNode(ln)); });
  set("cap", C2.caption);
  set("c3chip", "CHAPTER 3"); C3.head.forEach(function (ln, i) { if (i) $("t3").appendChild(document.createElement("br")); $("t3").appendChild(document.createTextNode(ln)); });
  set("d1a", C3.doc[0][0]); set("five", C3.doc[0][1]); set("d2a", C3.doc[1][0]); set("d2b", C3.doc[1][1]); set("d3a", C3.doc[2][0]); set("d3b", C3.doc[2][1]);
  set("knB", C3.knobB); set("knA", C3.knobA); set("tvAname", C3.tvA);
  set("st1", C3.stamp[0]); set("st2", C3.stamp[1]); set("st3", C3.stamp[2]);
  set("cardh", C4.cardHead);
  set("a2", C4.pre1.text); set("a3", C4.pre2.text); set("a4", C4.slam.text); set("a5", C4.post.text);
  set("b0", C5.head); set("b1", C5.slam.text);
  var icon = $(C5.icon === "bank" ? "icon-bank" : "icon-tape"); icon.style.display = "block";
  $("date").innerHTML = D.date[0] + "<br>" + D.date[1];

  var nc = $("noise").getContext("2d"), img = nc.createImageData(270, 480);
  function cl(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function oc(x) { x = cl(x); return 1 - Math.pow(1 - x, 3); }
  function bo(x) { x = cl(x); var c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function pin(t, a, d) { return oc((t - a) / (d || .35)); }
  function rnd(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function show(el, p, dy) { el.style.opacity = p; el.style.transform = "translateY(" + ((1 - p) * (dy || 40)) + "px)"; }
  function typed(el, txt, t, a, cps) { var n = Math.max(0, Math.floor((t - a) * cps)); el.textContent = txt.slice(0, n) + (n < txt.length && t >= a ? "_" : ""); el.style.opacity = t >= a ? 1 : 0; }
  // fit text to a max width with a floor (one line per block, no hyphen breaks); build.py caps
  // line lengths so the floor is not reached with the bundled fonts
  var FITS = [].slice.call(document.querySelectorAll("[data-fit]"));
  function fit() { FITS.forEach(function (el) { var base = +el.dataset.base, max = +el.dataset.fit, mn = +(el.dataset.min || 48); el.style.fontSize = base + "px"; var w = el.offsetWidth; if (w > max) el.style.fontSize = Math.max(mn, Math.floor(base * max / w)) + "px"; }); }
  function tc(t) { var f = Math.round(t * FPS), sec = Math.floor(t), fr = f % FPS, m = Math.floor(sec / 60), s = sec % 60;
    return "0:" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s + ":" + (fr < 10 ? "0" : "") + fr; }

  function draw(t) {
    fit();
    var f = Math.round(t * FPS);
    for (var i = 0; i < S.length; i++) S[i].style.opacity = (t >= CUT[i] && t < CUT[i + 1]) ? 1 : 0;
    var roll = 0, tg = null;
    for (var k = 0; k < TR.length; k++) { var d = t - TR[k].t; if (d > -.22 && d < .28) { roll = 1 - Math.abs(d - .03) / .25; tg = TR[k].g; } }
    roll = cl(roll);
    var pic = $("pic");
    var jx = roll * (rnd(f) - .5) * 70, vy = roll * (rnd(f + 9) - .3) * 260;
    pic.style.transform = "translate(" + jx + "px," + vy + "px) skewX(" + (roll * (rnd(f + 3) - .5) * 8) + "deg)";
    pic.style.filter = "blur(" + (0.7 + roll * 2.5) + "px) saturate(" + (1.15 + roll) + ")";
    var band = $("band"), b2 = $("band2");
    band.style.opacity = roll ? .9 : .18; band.style.top = (roll ? (rnd(f + 1) * 1700) : ((t * 140) % 2100) - 150) + "px";
    b2.style.opacity = roll * .8; b2.style.top = (rnd(f + 5) * 1880) + "px";
    var tr = $("trans"); tr.style.opacity = roll > .05 ? 1 : 0; if (tg) tr.innerHTML = tg;
    var dd = img.data, s = f * 7.31 + 1;
    for (var p = 0; p < dd.length; p += 4) { s = (s * 16807) % 2147483647; var v = s & 255; dd[p] = dd[p + 1] = dd[p + 2] = v; dd[p + 3] = 255; }
    nc.putImageData(img, 0, 0);
    $("noise").style.opacity = .08 + roll * .35;
    $("dot").style.opacity = (Math.floor(t * 2) % 2) ? .15 : 1;
    $("tc").textContent = tc(t);
    $("mode").textContent = t > D.stopT ? "■ STOP" : "▶ SP";

    // S0: PLAY, animated
    var c0 = D.cuts[0];
    var z0 = bo(t / .3); $("s0p").style.transform = "scale(" + (.96 + .04 * z0) + ")";
    $("s0bar").style.width = (cl(t / (c0 - .05)) * 100) + "%";
    $("s0play").style.opacity = (Math.floor(t * 10) % 2) ? .8 : 1;
    // S1 cassette (visible at the cut, settles in); title written on in marker
    var c1 = pin(t, c0, .4);
    $("cas").style.transform = "translateY(" + ((1 - c1) * 160 - (t - c0) * 10) + "px) rotate(" + (-1.5 + (1 - c1) * 3) + "deg) scale(" + (1.12 + (t - c0) * .012) + ")";
    $("r1").style.transform = "rotate(" + t * 220 + "deg)"; $("r2").style.transform = "rotate(" + t * 220 + "deg)";
    show($("l1"), pin(t, C1.l1.t, .3), 20); $("l1").style.transform += " rotate(-2deg)";
    var l2 = $("l2"), w2 = cl((t - C1.title.t) / C1.title.wipe);
    l2.style.clipPath = "inset(0 " + (100 - w2 * 100) + "% 0 0)";
    $("l2u").style.width = Math.min(640, l2.offsetWidth) + "px";
    $("l2u").style.transform = "rotate(-2deg) scaleX(" + oc((t - (C1.title.t + .75 * C1.title.wipe)) / .4) + ")";
    show($("np"), pin(t, c0 + .02, .3), 60);
    $("npt").textContent = t < C1.title.t ? C1.np : C1.title.np;
    $("npb").style.width = (cl((t - c0) / (D.cuts[1] - c0)) * 100) + "%";
    // S2: headline at the cut, typed sub-line, counter
    var k2 = D.cuts[1];
    var h1 = bo((t - k2) / .4); $("h1").style.opacity = cl((t - k2) * 15); $("h1").style.transform = "scale(" + (.85 + .15 * h1) + ")"; $("h1").style.transformOrigin = "left center";
    if (C2.sub.text) typed($("h2"), C2.sub.text, t, C2.sub.t, 22); else $("h2").style.opacity = 0;
    show($("p2"), pin(t, k2 + .05, .35), 60);
    var cn = Math.min(C2.counterEnd, Math.floor(Math.pow(cl((t - C2.counterT) / C2.counterDur), 2) * C2.counterEnd));
    $("ctr").textContent = ("000" + cn).slice(-4);
    $("ticks").style.backgroundPosition = (-t * 260) + "px 0";
    // S3: headline, TVs slide in, magnifier sweep, sloppy stamp, reviewer line
    var k3 = D.cuts[2];
    show($("t3"), pin(t, k3, .15), 20);
    var a = pin(t, k3 + .1, .4), b = pin(t, k3, .35);
    $("tvA").style.transform = "translateX(" + (-(1 - a) * 700) + "px)"; $("tvB").style.transform = "translateX(" + ((1 - b) * 900) + "px)";
    $("fA").textContent = t < C3.magT + .2 ? "o_o" : t < C3.stampT ? "⊙_⊙" : "^_^";
    var m = cl((t - C3.magT) / .75), mg = $("mag");
    mg.style.opacity = t > C3.magT - .05 && t < C3.stampT + .1 ? 1 : 0;
    mg.style.transform = "translate(" + (Math.sin(m * 6.28) * 60) + "px," + (m * 90) + "px)";
    $("five").style.transform = "scale(" + (1 + (t > C3.magT && t < C3.stampT ? .12 * Math.abs(Math.sin(t * 14)) : 0)) + ")";
    var st = $("stamp"), sp = cl((t - C3.stampT) / .18);
    st.style.opacity = sp; st.style.transform = "rotate(-8deg) scale(" + (2.2 - 1.2 * sp + Math.sin(t * 9) * .02 * sp) + ")";
    typed($("wk"), C3.reviewer, t, C3.stampT + .1, 40);
    // S4: brief card hero at the cut, glides up as the stack fills in; boxed slam word with shake
    var k4 = D.cuts[3];
    var cp = pin(t, k4, .2); $("card").style.opacity = cp; var mv = oc((t - C4.glideT) / .35); $("card").style.transform = "translateY(" + ((1 - mv) * 500 + (1 - cp) * 60) + "px) scale(" + (1 + .18 * (1 - mv)) + ") rotate(-1.2deg)";
    typed($("a1"), C4.lead, t, k4 + .05, 18); $("a1").style.opacity = 1;
    $("hl").style.width = (cl((t - (C4.glideT + .3)) / .4) * 640) + "px";
    show($("a2"), C4.pre1.text ? pin(t, C4.pre1.t, .3) : 0);
    show($("a3"), C4.pre2.text ? pin(t, C4.pre2.t, .25) : 0);
    var a3w = C4.pre2.text ? $("a3").offsetWidth + 40 : 0, a4 = $("a4");
    a4.style.left = (90 + a3w) + "px";
    a4.style.fontSize = "170px"; var room = 990 - (90 + a3w); if (a4.offsetWidth > room) a4.style.fontSize = Math.max(90, Math.floor(170 * room / a4.offsetWidth)) + "px";
    var n4 = cl((t - C4.slam.t) / .14);
    a4.style.opacity = n4; a4.style.transform = "rotate(-6deg) scale(" + (2.4 - 1.4 * n4) + ")";
    $("s4g").style.background = "rgba(255,61,90," + (.3 * n4) + ")";
    show($("a5"), C4.post.text ? pin(t, C4.post.t, .3) : 0);
    var shake = (t > C4.slam.t && t < C4.slam.t + .32) ? (rnd(f + 40) - .5) * 30 : 0;
    $("s4").style.transform = "translate(" + shake + "px," + (rnd(f + 41) - .5) * shake + "px)";
    var k5 = D.cuts[4];
    // deck status chip: PLAY while the stack builds, then a blinking PAUSE (keeps the lower third framed)
    var paused = t > C4.pauseT;
    $("pz").innerHTML = paused ? "&#10074;&#10074; PAUSE" : "&#9654; PLAY";
    $("pz").style.opacity = paused ? (Math.floor(t * 4) % 2 === 0 ? 1 : .55) : pin(t, k4 + .1, .3);
    // S5: panel at the cut, key word slams on its spoken word, tape remaining counts down to the card
    var bpp = pin(t, k5, .2); $("bp").style.opacity = bpp; $("bp").style.transform = "translateY(" + (1 - bpp) * 50 + "px)";
    var bk = bo((t - C5.slam.t) / .35); $("b1").style.opacity = cl((t - C5.slam.t) * 10); $("b1").style.transform = "scale(" + (.8 + .2 * bk) + ")"; $("b1").style.transformOrigin = "center";
    $("b1").style.left = (($("bp").offsetWidth - $("b1").offsetWidth) / 2 - 3) + "px";
    var bz = oc((t - C5.slam.t) / .35); icon.style.transform = "translateY(" + (1 - bz) * 70 + "px) scale(" + (1 + .3 * (1 - bz)) + ")";
    show($("rp"), pin(t, k5, .2), 60);
    var rem = Math.max(0, EC - t); $("rem").textContent = "-" + tc(rem).slice(2);  // "-MM:SS:FF" fits the panel at 150 px
    $("remb").style.width = (cl(rem / Math.max(.1, EC - k5)) * 100) + "%";
  }

  draw(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(0); });
  var tl = gsap.timeline({ paused: true }), clock = { t: 0 };
  tl.to(clock, { t: END, duration: END, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);

  // end card (kit/endcard.js) by a hard cut; a slow push keeps the hold moving under the tape grain
  var plan = KAEndCard.plan({ lastWordEnd: D.lastWordEnd, start: D.endcard.start, hold: D.endcard.hold, fps: FPS });
  if (Math.abs(plan.end - END) > 0.5 / FPS) throw new Error("style P: data-duration " + END + " != end-card plan end " + plan.end);
  var card = KAEndCard.mount({ tl: tl, root: root, start: plan.start, brand: D.brand });
  var logo = card.querySelector(".ka-endcard-logo");
  tl.to(logo, { scale: 1.07, duration: Math.max(0.1, END - plan.start - 0.4), ease: "none" }, plan.start + 0.4);
  var cname = card.querySelector(".ka-endcard-name");
  if (cname) tl.fromTo(cname, { scale: 1 }, { scale: 1.06, duration: Math.max(0.1, END - plan.start), ease: "none", immediateRender: false }, plan.start);
  tl.set({}, {}, END);
  window.__timelines["main"] = tl;
  window.__cues = { cuts: D.cuts, endcard: plan.start, stop: D.stopT };
})();
</script>
</body>
</html>
