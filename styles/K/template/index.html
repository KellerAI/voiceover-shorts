  }

  // ---------- backgrounds ----------
  var SKY_A = [P.n0, P.n1, P.n2, P.n3, P.purple, P.purple2];
  function sky(top, bot, cols) {
    var n = cols.length - 1;
    for (var y = top; y < bot; y++) {
      var v = (y - top) / (bot - top) * n, i = Math.floor(v), fr = v - i;

  function stars(t, top, bot, scroll) {

  }
  // far mountains (layer 1), mid skyline (layer 2), near clouds (layer 3)
  function mountains(base, scroll, col, col2, amp, seed) {
    for (var x = 0; x < W; x++) {

      var h = amp * (.55 + .3 * Math.sin(wx * .021 + seed) + .15 * Math.sin(wx * .057 + seed * 2));

    }
  }
  function skyline(base, scroll, t) {
    var bw = 22;
    for (var i = -1; i < W / bw + 2; i++) {
      var wi = Math.floor(scroll / bw) + i, x = i * bw - (scroll % bw);
      var h = 24 + Math.floor(hash(wi * 1.7) * 46), w = 14 + Math.floor(hash(wi * 2.3) * 8);
      px(x, base - h, w, h, P.graph); px(x, base - h, w, 2, P.g3); px(x + w - 2, base - h, 2, h, P.ink);
      for (var yy = base - h + 6; yy < base - 4; yy += 6) for (var xx = x + 3; xx < x + w - 4; xx += 4)
        if (hash(wi * 11 + yy * .7 + xx * .3) > .62) px(xx, yy, 2, 3, hash(wi + yy) > .5 ? P.gold : "#d9a640");
    }
  }
  function clouds(y0, scroll, col, hi) {
    for (var i = 0; i < 5; i++) {
      var x = ((i * 83 - scroll) % 380 + 380) % 380 - 60, y = y0 + hash(i * 3.7) * 30;
      px(x, y + 6, 54, 10, col); px(x + 8, y, 26, 8, col); px(x + 28, y + 2, 18, 6, col); px(x + 8, y, 26, 2, hi);
    }
  }

  // ---------- Mode-7 floor: per-scanline perspective, rotating + scaling texture ----------
  var FLOORS = {
    level: { a: hex(P.n2), b: hex(P.n3), line: hex(P.grey), fog: hex(P.purple2) },
    title: { a: hex(P.n1), b: hex(P.graph), line: hex(P.gold2), fog: hex(P.purple2) },
    school: { a: hex(P.cream), b: hex(P.cream2), line: hex(P.n4), fog: hex(P.purple2) }
  };
  function mode7(top, bot, camX, camZ, ang, scale, F) {
    var hgt = bot - top, img = c.getImageData(0, top, W, hgt), d = img.data;
    var ca = Math.cos(ang), sa = Math.sin(ang);

      var dist = 2400 * scale / (y + 2.5);
      var fog = cl(1 - (y) / 26);
      for (var x = 0; x < W; x++) {
        var sx = (x - 135) * dist / 120;
        var u = camX + sx * ca - dist * sa, v = camZ + sx * sa + dist * ca;
        var fu = u / 24, fv = v / 24, iu = Math.floor(fu), iv = Math.floor(fv);
        var gu = fu - iu, gv = fv - iv;

        var o = (y * W + x) * 4;

      }
    }

  }


  function mosaic(n) { if (n < 2) return; mc.clearRect(0, 0, W, H); var w = Math.ceil(W / n), h = Math.ceil(H / n);
    mc.drawImage(cv, 0, 0, W, H, 0, 0, w, h); c.drawImage(MOS, 0, 0, w, h, 0, 0, w * n, h * n); }
  function iris(cx, cy, r) { c.save(); c.beginPath(); c.rect(0, 0, W, H); c.arc(cx, cy, Math.max(0, r), 0, 6.283, true); c.fillStyle = P.n0; c.fill("evenodd"); c.restore(); }
  function spark(x, y, t, col) { var n = 8; for (var i = 0; i < n; i++) { var a = i / n * 6.283, rr = 6 + t * 40; px(x + Math.cos(a) * rr, y + Math.sin(a) * rr, 3, 3, i % 2 ? col : P.white); } }
  function bubble(x, y, w, h, tx) { bx(x, y, w, h, P.ink, P.cream, P.white, P.cream2); for (var i = 0; i < 6; i++) px(tx - i, y + h + i, 2 * i + 1, 1, i === 5 ? P.ink : P.cream); }

  // ---------- HUD: two rows, every glyph at scale >= 2 (the K16 1x labels were 28 px) ----------
  var HUD_H = 38;
  function hud(t, st) {
    bx(0, 0, W, HUD_H - 1, P.ink, P.n1, P.n3, P.n0); px(0, HUD_H - 1, W, 1, P.gold2);

    if (st.qq) mc2 = [P.mag, "#ffa3f6"];

  }
  // the bots stand on FY; the Mode-7 floor runs from the horizon to the bottom edge (no empty band)

  // ---------- hero lines: words type in as they are spoken; the key word slams in gold ----------
  function hero(t, h) {

    var boil = gag && t >= T.gagSloppy;

      if (pop < .2) return;

      for (var b = 0; b < ln.length; b++) {

        if (nn > 0) {

            if (boil) sloppy(w.t, x, y, sc, t, 3 + wi, [P.mag, P.red, P.orange, P.green2]);

          } else if (isKey) {
            var s0 = wi === 0 ? Math.min(w.s, h.t0) : w.s, sl = back(k(t, s0, s0 + .18)), dy = Math.round((1 - sl) * (neg ? -40 : -24));
            {
              if (neg) text(w.t, x, y + dy, sc, P.red, { sy: sy, ol: P.red3, sh: P.ink, top: "#ff8a9a", bot: P.red2, n: nn });
              else text(w.t, x, y + dy, sc, P.gold, { sy: sy, ol: P.gold3, sh: P.n0, top: P.gold1, bot: P.gold2, n: nn });

  // ---------- scene draw ----------
  function cen(w) { return Math.round((W - w) / 2); }
  function draw(t) {
    var shake = 0, fl = 0;
    function hit(at, dur, amt) { var q = k(t, at, at + dur); if (t >= at && q < 1) { shake = Math.max(shake, (1 - q) * amt); fl = Math.max(fl, (1 - q) * .5); } }
    var scene = t < T.stageStart ? "title" : t < T.levelStart ? "stage" : "level";

      var cs0 = T.coinSettle, cyy = 186 + (t < cs0 * .66 ? Math.round(Math.sin(t * 7) * 4) : 0);
      coin(135, cyy, 2.4, t < cs0 ? t * 9 : cs0 * 9 + (Math.ceil(cs0 * 9 / 6.283) * 6.283 - cs0 * 9) * eo(k(t, cs0, cs0 + .34)));
      if (t > cs0) spark(135, 186, k(t, cs0, cs0 + .34), P.gold);

    }

    if (scene === "stage") {
      sky(0, HZ, SKY_A); stars(t, 0, 220, t * 40);
      var spd = 260 * eio(k(t, T.stageStart, T.levelStart - .05));
      mountains(HZ, spd * .3, P.n3, P.n4, 60, 1); clouds(150, spd * .8, P.n4, P.n5);
      mode7(HZ, H, 0, 200 + spd * 4, Math.sin(t * .9) * .5, 1 + .4 * Math.sin(t * 1.3), FLOORS.level);
      text(K.text.stage, "c", 50, 3, P.grey2, { ol: P.ink });
      var hy = 82;
      T.headline.forEach(function (hl, i) {
        var syy = Math.round(hl.sc * 2.25), y = hy;
        hy += 7 * syy + 14;

        else { text(hl.t, "c", y, hl.sc, P.gold, { sy: syy, ol: P.gold3, sh: P.n0, top: P.gold1, bot: P.gold2 }); hit(hl.s, .3, 3); }
      });
      var sw = k(t, T.stageStart, T.stageStart + 1.2);
      bot(-40 + 175 * eo(sw), FY, { s: 2, walk: sw < 1 ? t * 9 : undefined, pal: PAL_A, lab: K.labels[0], blink: Math.floor(t * 10) % 31 === 0 });
    }

      stars(t, 40, 230, t * 4);
      mountains(HZ, t * 6, dim ? P.n2 : P.n3, P.n4, 80, 2);

      mode7(HZ, H, 0, 600 + t * 80, .25 * Math.sin(t * .6), 1.1, FLOORS.level);

      // HUD state from the words: +100 a word, meter climbs, ??? on the gag, drains on the negation, refills on the power-up
      var nw = 0; for (var si = 0; si < T.scoreTimes.length; si++) if (t >= T.scoreTimes[si]) nw++;
      st.score = nw * 100 + (t >= T.powerOn ? 10000 : 0);
      st.meter = 40 + 20 * k(t, T.levelStart, T.gag ? T.gag[0] : T.powerOn);
      if (T.gag && t >= T.gagSloppy && t < T.gag[1]) st.qq = true;
      if (NEG && t >= NEG.t) { st.meter = st.meter * (1 - eo(k(t, NEG.t, NEG.t + .5))); st.lives = 2; }
      if (t >= T.powerOn) { st.meter = st.meter + (100 - st.meter) * eo(k(t, T.powerOn, T.powerOn + .5)); st.lives = 3; }

      var h = null; for (var hi = 0; hi < T.hero.length; hi++) if (t >= T.hero[hi].t0 && t < T.hero[hi].t1) h = T.hero[hi];
      if (h) {
        hero(t, h);
        var kw = h.words[h.key];
        if (h.kind !== "gag" && t >= kw.s) hit(kw.s, h.kind === "not" ? .35 : .2, h.kind === "not" ? 4 : 2);
      }

      var walk = k(t, T.walk[0], T.walk[1]);
      var ax = 135 - 55 * eo(walk), ay = FY;
      var jump = t > T.bump - .1 && t < T.bump + .3 ? -Math.sin(k(t, T.bump - .1, T.bump + .3) * 3.14) * 60 : 0;
      var gagOn = T.gag && t >= T.gag[0] && t < T.gag[1];
      var xeyes = NEG && t >= NEG.t && t < NEG.t1;
      var gold = t >= T.powerOn;
      // power-up: ? block over A's head, bumped from below; a K coin rises out of it

      if (t >= T.bump - .6 && t < T.powerOn) {
        var bmp = t > T.bump && t < T.bump + .2 ? -6 * Math.sin(k(t, T.bump, T.bump + .2) * 3.14) : 0;
        qblock(qx, qy + bmp, t);
        if (t > T.bump + .1) { var rise = eo(k(t, T.bump + .1, T.bump + .56)); coin(qx + 14, qy - 6 - rise * 34, 1, t * 8); }
      }

        var pu = back(k(t, T.powerOn, T.powerOn + .2));
        if (pu > .1) text(K.text.power, "c", 222 - Math.round((1 - pu) * 16), 3, P.gold, { ol: P.gold3, sh: P.n0, top: P.gold1, bot: P.gold2 });
        if (t > T.powerOn + .12) text("1UP", ax + 30, 290, 2, P.green, { ol: P.ink });
      }
      var aeyes = xeyes ? "x" : gold ? "happy" : gagOn ? "smug" : "n";
      bot(ax, ay + jump, { s: 2, walk: walk > 0 && walk < 1 ? t * 9 : undefined, pal: gold ? PAL_G : PAL_A, lab: K.labels[0], eyes: aeyes, look: gagOn ? 3 : 0, blink: Math.floor(t * 10) % 37 === 0, arm: jump < -10 ? 1 : (gagOn ? 1 : 0), mag: gagOn && jump === 0 });
      if (t > T.twinDrop) {
        var dr = k(t, T.twinDrop, T.twinLand), byy = -100 + eo(dr) * (FY + 100), sqz = t > T.twinLand && t < T.twinLand + .22 ? 1 - k(t, T.twinLand, T.twinLand + .22) : 0;
        var beyes = xeyes ? "x" : gagOn ? "wide" : "n";
        bot(196, Math.min(byy, FY), { s: 2, pal: PAL_B, lab: K.labels[1], squash: sqz, eyes: beyes, look: -3, arm: 0, blink: Math.floor(t * 10) % 41 === 0 });
        hit(T.twinLand, .2, 2);
      }
      c.save(); c.translate(0, -Math.round((1 - eo(k(t, T.levelStart, T.levelStart + .35))) * 40)); hud(t, st); c.restore();
    }

    var mz = 0;
    [[T.stageStart, .1], [T.levelStart, .1]].forEach(function (m) { var dd = Math.abs(t - m[0]); if (dd < m[1]) mz = Math.max(mz, Math.round((1 - dd / m[1]) * 6)); });
    if (mz > 1) mosaic(mz);

    var sh = Math.round((hash(Math.floor(t * 30)) - .5) * 2 * shake) * 4, sv = Math.round((hash(Math.floor(t * 30) + 7) - .5) * 2 * shake) * 4;
    cv.style.transform = "translate(" + sh + "px," + sv + "px)";
    flick.style.opacity = fl * .5;
  }

  draw(0);
  var tl = gsap.timeline({ paused: true }), clock = { t: 0 };
  tl.to(clock, { t: END, duration: END, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);

  // ---------- end card (shared kit, hard cut after the last word) ----------
  var card = KAEndCard.mount({ tl: tl, root: document.getElementById("root"), start: T.ecStart, brand: K.brand });
  // a slow push on the logo keeps the hold alive (no frozen frames) without a fade
  tl.fromTo(card.querySelector(".ka-endcard-logo"), { scale: 1 }, { scale: 1.12, duration: Math.max(.5, END - T.ecStart - .4), ease: "none", immediateRender: false }, T.ecStart + .4);
  tl.set({}, {}, END);
  window.__timelines["main"] = tl;
})();
